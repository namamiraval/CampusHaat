spring.application.name=campusloop-backend
server.port=8080

# Create a local MySQL database named campusloop before running the application.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusloop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# CampusHaat University Email Configuration
campushaat.allowed-email-domains=sxca.edu.in,jgu.edu.in

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
campushaat.jwt.secret=${JWT_SECRET}
campushaat.jwt.expiration=86400000